[theme]
font = "sans serif"

[theme.light]
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1B2430"

[theme.dark]
primaryColor = "#6FA8DC"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#E6E9EF"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
